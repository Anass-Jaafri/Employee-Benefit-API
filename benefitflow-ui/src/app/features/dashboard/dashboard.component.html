<div class="page-shell">
  <div class="shell-card">
    <aside class="sidebar" [class.open]="sidebarOpen()">
      <div class="sidebar__brand">
        <div class="brand-mark">BF</div>
        <div class="brand-copy">
          <strong>BenefitFlow</strong>
          <span>Employee benefits</span>
        </div>
      </div>

      <div class="sidebar__section-title">Navigation</div>

      <nav class="nav-list">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span>
            <strong style="display:block;font-size:0.96rem;">{{ item.label }}</strong>
            <small style="color:rgba(229,231,235,0.6);">{{ item.hint }}</small>
          </span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="quick-card">
          <p>Signed in as</p>
          <strong>{{ auth.displayName() }}</strong>
          <p style="margin-top:8px;">{{ auth.email() }}</p>
        </div>
      </div>
    </aside>

    <section class="shell-main">
      <header class="topbar">
        <button class="icon-btn" type="button" (click)="toggleSidebar()">☰</button>

        <div class="topbar__title">
          <h1>Benefit management dashboard</h1>
          <p>Track companies, employees, claims, and packages in one place.</p>
        </div>

        <div class="topbar__search">
          <div class="search-pill">
            <span>⌕</span>
            <input type="text" placeholder="Search employees, claims, packages..." />
          </div>
        </div>

        <div class="topbar__actions">
          <button class="icon-btn" type="button" aria-label="Notifications">🔔</button>
          <button class="badge-btn" type="button">
            <span style="width:10px;height:10px;border-radius:999px;background:var(--brand-2);display:inline-block;"></span>
            {{ auth.displayName() }}
          </button>
          <button class="secondary-btn" type="button" (click)="logout()">Logout</button>
        </div>
      </header>

      <main class="content">
        <router-outlet />
      </main>
    </section>
  </div>
</div>
