<header
  class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90"
>
  <div class="flex flex-col gap-4 px-4 py-4 md:px-6 xl:px-8">
    <div class="flex items-center justify-between gap-4">
      <div class="flex min-w-0 items-center gap-3">
        <button
          type="button"
          class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 lg:hidden"
          (click)="menuClick.emit()"
          aria-label="Open sidebar"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <div class="min-w-0">
          <p
            class="truncate text-lg font-bold tracking-tight text-slate-900 md:text-xl dark:text-white"
          >
            {{ pageTitle() | titlecase }}
          </p>
          <p class="truncate text-sm text-slate-500 dark:text-slate-400">
            {{ pageSubtitle() | titlecase }}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button
          type="button"
          class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
          (click)="theme.toggle()"
          aria-label="Toggle theme"
        >
          <mat-icon>{{ theme.darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <div class="hidden items-center gap-3 md:flex">
          <div
            class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-2 text-right dark:border-slate-700 dark:bg-slate-800"
          >
            <p class="text-sm font-semibold text-slate-900 dark:text-white">
              {{ currentUser()?.email || 'Authenticated user' }}
            </p>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              {{ currentUser()?.role | titlecase }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <app-dashboard-breadcrumb />
  </div>
</header>
